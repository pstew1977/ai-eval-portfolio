name: AI Evaluation Suite

# Runs the DeepEval test suite automatically on every push/PR.
# This is the piece that turns "I ran some tests once" into
# "I built a repeatable evaluation pipeline that gates changes" -
# directly relevant to "automated evaluation pipelines" in the job specs.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run AI evaluation suite
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: deepeval test run tests/
